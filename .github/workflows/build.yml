name: Build

on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - uses: actions/checkout@v1

    - name: Install Dependencies
      shell: bash
      env:
        GITHUB_OS: ${{ matrix.os }}
      run: |
        if [ "$GITHUB_OS" == "macOS-latest" ];
        then
          brew install luajit gnu-sed
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
        elif [ "$GITHUB_OS" == "ubuntu-latest" ];
        then
          sudo apt-get install -y luajit
        elif [ "$GITHUB_OS" == "windows-latest" ];
        then
          vcpkg install luajit:x64-windows
          echo "/C/vcpkg/installed/x64-windows/tools/luajit" >> $GITHUB_PATH
          echo "/C/vcpkg/installed/x64-windows/bin"   >> $GITHUB_PATH
        fi

    - name: Download Submodules
      run: |
        git submodule update --init --recursive
      if: github.event_name != 'schedule'

    - name: Download Latest ImGui
      shell: bash
      run: |
        rm -rf imgui
        git clone https://github.com/ocornut/imgui.git
      if: github.event_name == 'schedule'

    - name: Patch ImGui Win32 Backend
      shell: bash
      env:
        GITHUB_OS: ${{ matrix.os }}
      run: |
        if [ "$GITHUB_OS" == "windows-latest" ]; then
          # First verify the file exists and show content before modification
          powershell -Command "Get-Content imgui/backends/imgui_impl_win32.h | Select -First 20"
          
          # Change #if 0 to #if 1
          powershell -Command "(Get-Content imgui/backends/imgui_impl_win32.h -Raw) | 
            ForEach-Object { $_ -replace '#if 0', '#if 1' } |
            Set-Content imgui/backends/imgui_impl_win32.h;
            Get-Content imgui/backends/imgui_impl_win32.h | Select -First 20"
        else
          sed -i 's/#if 0/#if 1/g' imgui/backends/imgui_impl_win32.h
        fi

    - name: Generate Bindings
      shell: bash
      run: |
        cd ./generator
        bash ./generator.sh

    - name: Upload Generator Output
      uses: actions/upload-artifact@v4
      with:
        name: generator-output-${{ matrix.os }}
        path: |
          generator/output/
          cimgui.cpp
          cimgui.h